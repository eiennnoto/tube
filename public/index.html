<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClassroomTube</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="メニュー">☰</button>
    <a class="brand" href="/">ClassroomTube</a>
    <form id="searchForm" class="searchbar">
      <input id="searchInput" type="search" placeholder="検索" autocomplete="off">
      <button type="submit">🔍</button>
    </form>
    <button class="list-btn" id="listBtn">動画リスト</button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <a href="/">🏠 ホーム</a>
      <a href="/list">📚 動画リスト</a>
      <div class="side-note">Google Classroom<br>検索連携</div>
    </aside>

    <main id="app" class="content"></main>
  </div>

  <template id="emptyTemplate">
    <div class="empty">
      <div class="empty-icon">▶</div>
      <h2>動画を探そう</h2>
      <p>上の検索欄からGoogle Classroomの動画を検索できます。</p>
    </div>
  </template>

  <script src="/app.js"></script>
</body>
</html>
