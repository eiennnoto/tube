<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCK Video</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon-button" aria-label="メニュー">☰</button>
    <a class="brand" href="/">PCK<span>Video</span></a>

    <form id="searchForm" class="search">
      <input id="searchInput" type="search" placeholder="動画を検索" autocomplete="off">
      <button type="submit">検索</button>
    </form>

    <div class="top-actions">
      <button id="addCurrentBtn" class="top-button" hidden>＋ リストに追加</button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <button class="nav-item active" data-page="home">⌂ <span>ホーム</span></button>
      <button class="nav-item" data-page="list">▣ <span>動画リスト</span></button>
    </aside>

    <main class="main">
      <section id="homePage">
        <div class="page-title-row">
          <h1 id="pageTitle">おすすめ / 検索結果</h1>
          <span id="status" class="status"></span>
        </div>
        <div id="results" class="grid"></div>
      </section>

      <section id="videoPage" hidden>
        <div class="watch">
          <div class="player-wrap">
            <iframe
              id="player"
              title="動画プレイヤー"
              allow="autoplay; fullscreen; picture-in-picture"
              allowfullscreen
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
          </div>

          <h1 id="videoTitle" class="video-title">読み込み中…</h1>

          <div class="watch-actions">
            <button id="saveVideoBtn" class="save-button">＋ 動画リストに追加</button>
            <a id="openClassroom" class="secondary-button" target="_blank" rel="noopener">Classroomで開く</a>
          </div>

          <p id="videoDescription" class="description"></p>
        </div>
      </section>

      <section id="listPage" hidden>
        <div class="page-title-row">
          <h1>動画リスト</h1>
          <button id="clearListBtn" class="danger-button">すべて削除</button>
        </div>
        <div id="savedList" class="list-grid"></div>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
